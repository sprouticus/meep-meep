<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meep Meep · NM Rail Runner</title>
<meta name="description" content="Meep Meep — a mobile app prototype for the New Mexico Rail Runner Express. Next-train countdown, editable route, and full daily departures.">
<meta name="theme-color" content="#7A4E2E">
<meta property="og:type" content="website">
<meta property="og:title" content="Meep Meep · NM Rail Runner">
<meta property="og:description" content="A mobile app prototype for the New Mexico Rail Runner Express — next-train countdown, editable route, and full daily departures.">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sand-100:#FFEDCB;
    --sand-200:#EFE0C4;
    --sand-300:#E4CDA0;
    --tan-400:#D5B27E;
    --tan-500:#C2996A;
    --adobe-600:#A6764C;
    --brown-700:#7A4E2E;
    --brown-800:#5A3821;
    --brown-900:#3B2415;
    --cream:#FFF9EE;
    --red:#C1392B;
    --red-dark:#9B2F22;
    --red-light:#CC5747;
    --yellow:#DEA01E;
    --yellow-dark:#D9A200;
    --blue:#0177C0;
    --blue-dark:#015C90;
    --ink:#3B2415;
    --ink-soft:#7A5C3E;
    --line:#D8BE94;
    --shadow-soft: 0 10px 24px rgba(59,36,21,0.14);
    --shadow-card: 0 4px 14px rgba(90,56,33,0.10);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    min-height:100dvh;
    font-family:'Inter',system-ui,sans-serif;
    background: radial-gradient(circle at 20% 10%, #4a3520 0%, #2b1c10 55%, #1c1209 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Phone frame: locks the app to mobile dimensions on any viewport ---------- */
  .device{
    position:relative;
    width:100vw;
    height:100vh;
    height:100dvh;
    max-width:428px;
    max-height:926px;
    background:var(--sand-100);
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }

  @media (min-width:480px) and (min-height:700px){
    .device{
      width:412px;
      height:890px;
      border-radius:46px;
      box-shadow: var(--shadow-soft), 0 0 0 10px #1a1109, 0 0 0 11px #4a3520;
    }
    .device::before{
      content:"";
      position:absolute;
      top:14px; left:50%;
      transform:translateX(-50%);
      width:120px; height:26px;
      background:#1a1109;
      border-radius:20px;
      z-index:50;
    }
  }

  .screen{
    flex:1;
    min-height:0;
    padding-bottom:18px;
    overflow-y:auto;
    overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    background:
      radial-gradient(ellipse 480px 220px at 85% -8%, rgba(242,183,5,0.20), transparent 60%),
      radial-gradient(ellipse 420px 200px at -10% 0%, rgba(1,119,192,0.14), transparent 55%),
      var(--sand-100);
  }
  .screen::-webkit-scrollbar{display:none;}

  .safe-top{ padding-top: calc(8px + env(safe-area-inset-top, 0px)); }
  .safe-bottom{ padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); }

  @media (min-width:480px) and (min-height:700px){
    .safe-top{ padding-top:52px; }
  }

  /* ---------- Header ---------- */
  .header{
    padding-left:20px;
    padding-right:20px;
    padding-bottom:14px;
  }
  .header-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:9px;
  }
  .brand-mark{
    width:38px;height:38px;
    display:flex;align-items:center;justify-content:center;
    background:var(--red);
    border-radius:11px;
    box-shadow: var(--shadow-card);
    flex-shrink:0;
    overflow:hidden;
  }
  .brand-mark img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .brand-name{
    font-family:'Inter',system-ui,sans-serif;
    font-weight:700;
    font-size:20px;
    letter-spacing:0.2px;
    color:var(--brown-900);
    line-height:1;
  }
  .brand-sub{
    font-size:10.5px;
    font-weight:600;
    letter-spacing:1.1px;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-top:3px;
  }
  .date-label{
    display:flex;
    align-items:center;
    gap:6px;
    color:var(--brown-800);
    font-size:11.5px;
    font-weight:600;
    white-space:nowrap;
  }
  .date-label .date-icon{
    width:14px;
    height:14px;
    flex-shrink:0;
  }

  /* ---------- Direction toggle ---------- */
  .section{ padding:0 20px; margin-top:16px; }
  .label-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:9px;
  }
  .eyebrow{
    font-size:11px;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--ink-soft);
  }

  .direction-toggle{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  .dir-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    padding:12px 10px;
    border-radius:14px;
    border:1.5px solid var(--line);
    background:var(--cream);
    color:var(--brown-800);
    font-family:'Inter',system-ui,sans-serif;
    font-weight:600;
    font-size:14.5px;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .dir-btn svg{ width:16px; height:16px; }
  .dir-btn.active{
    background:var(--blue);
    border-color:var(--blue-dark);
    color:#fff;
    box-shadow: var(--shadow-card);
    transform:translateY(-1px);
  }
  .dir-btn:active{ transform:scale(0.98); }

  /* ---------- Trip ticket card ---------- */
  .ticket{
    margin-top:14px;
    background:var(--cream);
    border-radius:18px;
    box-shadow:var(--shadow-card);
    border:1px solid var(--line);
    overflow:hidden;
  }
  .ticket-row{
    display:flex;
    align-items:center;
    padding:14px 16px;
    gap:12px;
  }
  .ticket-dot{
    width:9px;height:9px;
    border-radius:50%;
    flex-shrink:0;
  }
  .ticket-dot.from{ background:var(--blue); }
  .ticket-dot.to{ background:var(--red); }
  .ticket-field{ flex:1; min-width:0; }
  .ticket-field label{
    display:block;
    font-size:10px;
    font-weight:700;
    letter-spacing:0.8px;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:2px;
  }
  .ticket-select{
    appearance:none;
    -webkit-appearance:none;
    border:none;
    background:transparent;
    font-family:'Inter',system-ui,sans-serif;
    font-weight:600;
    font-size:16px;
    color:var(--brown-900);
    width:100%;
    padding:2px 20px 2px 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='%237A5C3E'><path d='M5.5 7.5l4.5 4.5 4.5-4.5' stroke='%237A5C3E' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat;
    background-position:right center;
    background-size:16px;
  }
  .ticket-select:focus{ outline:none; }
  .ticket-divider{
    height:1px;
    margin:0 16px;
    background-image: linear-gradient(to right, var(--line) 50%, transparent 0%);
    background-size:9px 1px;
    background-repeat:repeat-x;
  }
  .swap-wrap{
    display:flex;
    justify-content:flex-end;
    padding:0 14px;
    margin-top:-13px;
    position:relative;
    z-index:2;
    pointer-events:none;
  }
  .swap-btn{
    pointer-events:auto;
    width:30px;height:30px;
    border-radius:50%;
    background:var(--yellow);
    border:2px solid var(--sand-100);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    box-shadow:0 2px 6px rgba(59,36,21,0.25);
  }
  .swap-btn svg{ width:14px;height:14px; }
  .swap-btn:active{ transform:scale(0.92); }

  /* ---------- Compact route bar (replaces persistent pickers) ---------- */
  .route-bar{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:var(--cream);
    border:1px solid var(--line);
    border-radius:16px;
    padding:12px 14px;
    box-shadow:var(--shadow-card);
    font-family:inherit;
    cursor:pointer;
    text-align:left;
  }
  .route-bar-left{ min-width:0; }
  .dir-chip{
    display:inline-flex;
    align-items:center;
    gap:4px;
    font-size:10.5px;
    font-weight:700;
    letter-spacing:0.5px;
    text-transform:uppercase;
    color:var(--blue-dark);
    background:rgba(1,119,192,0.12);
    padding:3px 9px;
    border-radius:20px;
    margin-bottom:6px;
  }
  .route-bar-title{
    font-family:'Inter',system-ui,sans-serif;
    font-weight:600;
    font-size:16.5px;
    color:var(--brown-900);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .route-bar-title .arrow{ color:var(--red); margin:0 5px; }
  .edit-icon{
    flex-shrink:0;
    width:34px;height:34px;
    border-radius:50%;
    background:transparent;
    border:1.5px solid var(--red);
    color:var(--red);
    display:flex;align-items:center;justify-content:center;
    transition:background .15s ease, color .15s ease;
  }
  .edit-icon.is-active{
    background:var(--red);
    color:#fff;
  }
  .edit-icon svg{ width:15px;height:15px; }

  /* ---------- Filter dropdown ---------- */
  .filter-dropdown{
    position:relative;
  }
  .filter-dropdown-btn{
    display:flex;
    align-items:center;
    gap:6px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:12.5px;
    padding:7px 12px;
    border-radius:20px;
    border:1.5px solid var(--line);
    background:var(--cream);
    color:var(--brown-800);
    cursor:pointer;
  }
  .filter-dropdown-btn .chevron{
    width:14px;
    height:14px;
    transition:transform 0.15s ease;
  }
  .filter-dropdown.open .filter-dropdown-btn{
    border-color:var(--brown-900);
  }
  .filter-dropdown.open .filter-dropdown-btn .chevron{
    transform:rotate(180deg);
  }
  .filter-dropdown-menu{
    display:none;
    position:absolute;
    top:calc(100% + 6px);
    right:0;
    min-width:120px;
    background:var(--cream);
    border:1px solid var(--line);
    border-radius:12px;
    box-shadow:var(--shadow-card);
    padding:4px;
    z-index:20;
  }
  .filter-dropdown.open .filter-dropdown-menu{
    display:block;
  }
  .filter-dropdown-option{
    display:block;
    width:100%;
    text-align:left;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13px;
    padding:8px 10px;
    border-radius:8px;
    border:none;
    background:transparent;
    color:var(--brown-800);
    cursor:pointer;
  }
  .filter-dropdown-option.active{
    background:var(--brown-900);
    color:#fff;
  }

  /* ---------- Bottom sheet (trip editor) ---------- */
  .sheet-overlay{
    position:absolute;
    inset:0;
    background:rgba(28,18,9,0.45);
    opacity:0;
    pointer-events:none;
    transition:opacity .22s ease;
    z-index:40;
    display:flex;
    align-items:flex-end;
  }
  .sheet-overlay.open{
    opacity:1;
    pointer-events:auto;
  }
  .sheet{
    width:100%;
    background:var(--sand-100);
    border-radius:24px 24px 0 0;
    padding:10px 20px 24px;
    transform:translateY(100%);
    transition:transform .28s cubic-bezier(.25,.8,.35,1);
    box-shadow:0 -12px 30px rgba(28,18,9,0.25);
    max-height:82%;
    overflow-y:auto;
  }
  .sheet-overlay.open .sheet{ transform:translateY(0); }
  .sheet-handle{
    width:38px;height:4px;
    border-radius:4px;
    background:var(--line);
    margin:6px auto 14px;
  }
  .sheet h3{
    font-family:'Inter',system-ui,sans-serif;
    font-size:17px;
    margin:0 0 14px;
    color:var(--brown-900);
  }
  .sheet-done{
    width:100%;
    margin-top:16px;
    background:var(--blue);
    color:#fff;
    border:none;
    border-radius:14px;
    padding:14px;
    font-family:'Inter',system-ui,sans-serif;
    font-weight:600;
    font-size:15.5px;
    cursor:pointer;
  }
  .sheet-done:active{ transform:scale(0.98); }

  /* ---------- Hero next-train card ---------- */
  .hero{
    margin-top:18px;
    border-radius:20px;
    padding:20px 20px 18px;
    background: linear-gradient(150deg, var(--blue) 0%, var(--blue-dark) 68%, #073650 100%);
    color:#fff;
    box-shadow: 0 10px 22px rgba(1,92,144,0.35);
    position:relative;
    overflow:hidden;
  }
  .hero::after{
    content:"";
    position:absolute;
    right:-30px; bottom:-40px;
    width:150px;height:150px;
    border-radius:50%;
    background:rgba(255,255,255,0.06);
  }
  .hero-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:relative;
    z-index:1;
  }
  .hero-eyebrow{
    font-size:11px;
    font-weight:700;
    letter-spacing:1.2px;
    text-transform:uppercase;
    color:rgba(255,255,255,0.78);
  }
  .badge{
    font-size:10.5px;
    font-weight:700;
    letter-spacing:0.5px;
    padding:4px 9px;
    border-radius:20px;
    background:var(--yellow);
    color:var(--brown-900);
  }

  .hero-countdown{
    display:flex;
    align-items:baseline;
    flex-wrap:wrap;
    gap:8px;
    margin-top:6px;
    position:relative;
    z-index:1;
  }
  .hero-countdown .num{
    font-family:'Inter',system-ui,sans-serif;
    font-weight:700;
    font-size:56px;
    line-height:1;
    color:var(--yellow);
  }
  .hero-countdown .unit{
    font-family:'Inter',system-ui,sans-serif;
    font-weight:600;
    font-size:18px;
    color:rgba(255,255,255,0.92);
  }

  .hero-route{
    margin-top:12px;
    font-size:15px;
    font-weight:600;
    color:#fff;
    position:relative;
    z-index:1;
  }
  .hero-route .arrow{ color:var(--yellow); margin:0 6px; }

  .hero-times{
    display:flex;
    gap:22px;
    margin-top:14px;
    position:relative;
    z-index:1;
  }
  .hero-time-block .k{
    font-size:10px;
    font-weight:700;
    letter-spacing:0.8px;
    text-transform:uppercase;
    color:rgba(255,255,255,0.65);
    margin-bottom:2px;
  }
  .hero-time-block .v{
    font-family:'Inter',system-ui,sans-serif;
    font-size:19px;
    font-weight:600;
  }


  /* ---------- Empty / done states ---------- */
  .state-card{
    margin-top:18px;
    background:var(--cream);
    border:1.5px dashed var(--tan-500);
    border-radius:18px;
    padding:26px 20px;
    text-align:center;
  }
  .state-card .icon{ font-size:30px; margin-bottom:8px; }
  .state-card h3{
    font-family:'Inter',system-ui,sans-serif;
    margin:0 0 4px;
    font-size:16.5px;
    color:var(--brown-900);
  }
  .state-card p{
    margin:0;
    font-size:13px;
    color:var(--ink-soft);
    line-height:1.45;
  }
  .state-card .next-tomorrow{
    display:inline-block;
    margin-top:12px;
    background:var(--blue);
    color:#fff;
    font-weight:700;
    font-size:13px;
    padding:8px 14px;
    border-radius:12px;
  }

  /* ---------- Departures list ---------- */
  .list-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:20px 0 10px;
  }
  .list-head h2{
    font-family:'Inter',system-ui,sans-serif;
    font-size:15.5px;
    margin:0;
    color:var(--brown-900);
  }

  .dep-row{
    background:var(--cream);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px 14px;
    margin-bottom:9px;
    cursor:pointer;
    transition:border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .dep-row.is-my-train{
    border-color:#897456;
    box-shadow:0 0 0 1.5px #897456;
  }
  .dep-row-top{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .dep-time-col{ width:64px; flex-shrink:0; }
  .dep-time-col .t{
    display:flex;
    align-items:center;
    gap:4px;
    font-family:'Inter',system-ui,sans-serif;
    font-weight:600;
    font-size:15.5px;
    color:var(--brown-900);
  }
  .dep-row.is-my-train .dep-time-col .t{ font-weight:800; }
  .dep-time-col .t .star-badge{ width:12px;height:12px; flex-shrink:0; }
  .dep-time-col .ap{
    font-size:10px;
    color:var(--ink-soft);
    font-weight:600;
  }
  .dep-mid{ flex:1; min-width:0; }
  .dep-mid .dots-row{
    display:flex;
    align-items:center;
    gap:3px;
    margin-top:5px;
  }
  .dep-mid .dots-row .end{
    width:6px;height:6px;border-radius:50%;
    background:var(--blue);
    flex-shrink:0;
  }
  .dep-mid .dots-row .end.last{ background:var(--red); }
  .dep-mid .dots-row .track{
    flex:1;
    height:2px;
    background:var(--line);
    position:relative;
  }
  .dep-mid .stops-text{
    font-size:11px;
    color:var(--ink-soft);
    font-weight:500;
  }
  .dep-arrive-col{
    text-align:right;
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .dep-arrive-col .t{
    font-family:'Inter',system-ui,sans-serif;
    font-weight:600;
    font-size:15.5px;
    color:var(--brown-900);
  }
  .dep-arrive-col .k{
    font-size:10px;
    color:var(--ink-soft);
    font-weight:600;
  }
  .dep-arrive-col .chevron{
    width:16px;height:16px;
    color:var(--ink-soft);
    flex-shrink:0;
    transition:transform .2s ease;
  }
  .dep-row.is-expanded .dep-arrive-col .chevron{ transform:rotate(180deg); }
  .chip{
    display:inline-block;
    font-size:9.5px;
    font-weight:700;
    letter-spacing:0.4px;
    padding:2px 7px;
    border-radius:8px;
  }
  .chip.express{ background:#FBE7B4; color:#8A5A00; }
  .chip.local{ background:var(--sand-300); color:var(--ink-soft); }

  /* ---------- Expanded departure actions ---------- */
  .dep-expand{
    margin-top:12px;
    padding-top:12px;
  }
  .dep-stop-detail{
    margin-bottom:14px;
  }
  .stop-rail-mini{
    display:flex;
    align-items:center;
    gap:4px;
  }
  .stop-rail-mini .cap{
    width:7px;height:7px;border-radius:50%;
    flex-shrink:0;
    background:var(--blue);
  }
  .stop-rail-mini .cap.to{ background:var(--red); }
  .stop-rail-mini .seg{
    flex:1;
    height:2px;
    background:var(--line);
    display:flex;
    align-items:center;
    justify-content:space-evenly;
    min-width:6px;
  }
  .stop-rail-mini .seg i{
    width:5px;height:5px;border-radius:50%;
    background:var(--tan-500);
  }
  .dep-actions{
    display:flex;
    gap:8px;
  }
  .expand-action{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:10px 8px;
    border-radius:12px;
    font-family:'Inter',system-ui,sans-serif;
    font-size:12.5px;
    font-weight:700;
    border:1.5px solid var(--line);
    background:var(--sand-100);
    color:var(--brown-800);
    text-decoration:none;
    cursor:pointer;
  }
  .expand-action svg{ width:15px;height:15px; flex-shrink:0; }
  .expand-action.buy-tickets-link{
    background:var(--blue);
    border-color:var(--blue-dark);
    color:#fff;
  }
  .expand-action.select-my-train-btn.is-selected{
    background:var(--yellow);
    border-color:var(--yellow-dark);
    color:var(--brown-900);
  }
  .expand-action:active{ transform:scale(0.97); }

  /* Pinned to the bottom of the device frame at any screen size: it is a
     flex sibling of .screen (which takes flex:1), not part of the scroll area. */
  .footer-note{
    flex:0 0 auto;
    text-align:center;

        var i = codes.indexOf(code);
        if(ex[code] === 2){ if(i > -1) codes.splice(i,1); }       // removed

      });
      out[dir].push({
        id: svc + "-" + dir + "-" + no,
        trainNo: no,
        direction: dir,
        express: express,
        stops: stops
      });

    out.N.sort(function(a,b){ return a.stops[Object.keys(a.stops)[0]].time - b.stops[Object.keys(b.stops)[0]].time; });

      var dep = fmtTime(heroTrip.depMin);
      var arr = fmtTime(heroTrip.arrMin);
      var cdParts = fmtCountdown(mins);
      var cdHtml = cdParts.map(function(p){
        return '<span class="num">' + p.n + '</span><span class="unit">' + p.u + '</span>';
      }).join("");

      html += '<div class="hero">' +
        '<div class="hero-top">' +
          '<span class="hero-eyebrow">' + (isMyTrainMode ? "★ My Train Departs In" : "Next Train Departs In") + '</span>' +
          '<span class="badge ' + (heroTrip.express ? "" : "local") + '">' + (heroTrip.express ? "Express" : "Local") + '</span>' +
        '</div>' +
        '<div class="hero-countdown">' + cdHtml + '</div>' +
        '<div class="hero-route">' + fromName + '<span class="arrow">→</span>' + toName + '</div>' +
        '<div class="hero-times">' +
          '<div class="hero-time-block"><div class="k">Departs</div><div class="v">' + dep.time + ' ' + dep.ap + '</div></div>' +
          '<div class="hero-time-block"><div class="k">Arrives</div><div class="v">' + arr.time + ' ' + arr.ap + '</div></div>' +
        '</div>' +
      '</div>';

      html += '<div class="list-head"><h2>Today’s Departures</h2>' + buildFilterDropdown() + '</div>';

      var ticketLink = getTicketLink();

      upcoming.forEach(function(t, i){
        var d = fmtTime(t.depMin);
        var a = fmtTime(t.arrMin);
        var sText = t.stopCount === 0 ? "Nonstop" : (t.stopCount + (t.stopCount === 1 ? " stop" : " stops"));
        var sTextFull = t.stopCount === 0 ? "Nonstop" : (sText + " from " + fromName + " to " + toName);
        var rowIsSelected = t.id === state.selectedTripId;
        var rowIsExpanded = t.id === state.expandedTripId;
        var rowClass = "dep-row" + (rowIsSelected ? " is-my-train" : "") + (rowIsExpanded ? " is-expanded" : "");

        html += '<div class="' + rowClass + '" data-trip-id="' + t.id + '">' +
          '<div class="dep-row-top">' +
            '<div class="dep-time-col"><div class="t">' + d.time + (rowIsSelected ? ICON_STAR_BADGE : '') + '</div><div class="ap">' + d.ap + '</div></div>' +
            '<div class="dep-mid">' +
              '<div class="stops-text">' + (rowIsExpanded ? sTextFull : sText) + '</div>' +
              (rowIsExpanded ? '' : '<div class="dots-row"><span class="end"></span><span class="track"></span><span class="end last"></span></div>') +
            '</div>' +
            '<div class="dep-arrive-col"><div><div class="t">' + a.time + '</div><div class="k">' + a.ap + '</div></div>' + ICON_CHEVRON + '</div>' +
          '</div>' +
          (rowIsExpanded ?
            '<div class="dep-expand">' +
              '<div class="dep-stop-detail">' +
                '<div class="stop-rail-mini"><span class="cap from"></span><span class="seg">' + renderStopRail(t.stopCount) + '</span><span class="cap to"></span></div>' +
              '</div>' +
              '<div class="dep-actions">' +
                '<a class="expand-action buy-tickets-link" href="' + ticketLink + '" target="_blank" rel="noopener noreferrer">' + ICON_TICKET + 'Buy Tickets</a>' +
                '<button class="expand-action select-my-train-btn' + (rowIsSelected ? " is-selected" : "") + '" data-trip-id="' + t.id + '" type="button">' +
                  (rowIsSelected ? ICON_STAR_FILLED + 'Train Selected' : ICON_STAR_OUTLINE + 'Select My Train') +
                '</button>' +
              '</div>' +
            '</div>'
          : '') +
        '</div>';
      });
    }

    els.resultsSection.innerHTML = html;
  }

  function clearTripSelection(){
    state.selectedTripId = null;
    state.expandedTripId = null;
  }

  function setDirection(dir){
    if(state.direction === dir) return;
    // flip from/to so the trip still makes sense in the new direction
    var oldFrom = state.fromIdx, oldTo = state.toIdx;
    state.direction = dir;
    state.fromIdx = oldTo !== null ? oldTo : oldFrom;
    state.toIdx = oldFrom;
    if(!isValidPair(dir, state.fromIdx, state.toIdx)){
      var order = orderedIndices(dir);
      state.fromIdx = order[0];
      state.toIdx = order[order.length-1];
    }
    clearTripSelection();
    els.btnNorth.classList.toggle("active", dir === "N");
    els.btnSouth.classList.toggle("active", dir === "S");
    populateSelects();
    render();
  }

  els.btnNorth.addEventListener("click", function(){ setDirection("N"); });
  els.btnSouth.addEventListener("click", function(){ setDirection("S"); });

  els.fromSelect.addEventListener("change", function(){
    state.fromIdx = parseInt(this.value,10);
    clearTripSelection();
    populateSelects();
    render();
  });
  els.toSelect.addEventListener("change", function(){
    state.toIdx = parseInt(this.value,10);
    clearTripSelection();
    render();
  });

  els.swapBtn.addEventListener("click", function(){
    if(state.toIdx === null) return;
    var newFrom = state.toIdx, newTo = state.fromIdx;
    state.direction = state.direction === "N" ? "S" : "N";
    state.fromIdx = newFrom;
    state.toIdx = newTo;
    clearTripSelection();
    els.btnNorth.classList.toggle("active", state.direction === "N");
    els.btnSouth.classList.toggle("active", state.direction === "S");
    populateSelects();
    render();
  });

  els.resultsSection.addEventListener("click", function(e){
    var dropdownToggle = e.target.closest(".filter-dropdown-btn");
    if(dropdownToggle){
      state.filterMenuOpen = !state.filterMenuOpen;
      render();
      return;
    }

    var dropdownOption = e.target.closest(".filter-dropdown-option");
    if(dropdownOption){
      state.filter = dropdownOption.getAttribute("data-filter");
      state.filterMenuOpen = false;
      render();
      return;
    }

    if(state.filterMenuOpen && !e.target.closest(".filter-dropdown")){
      state.filterMenuOpen = false;
      render();
      return;
    }

    var selectBtn = e.target.closest(".select-my-train-btn");
    if(selectBtn){
      var btnTripId = selectBtn.getAttribute("data-trip-id");
      state.selectedTripId = (state.selectedTripId === btnTripId) ? null : btnTripId;
      render();
      return;
    }

    var buyLink = e.target.closest(".buy-tickets-link");
    if(buyLink) return; // let the link navigate normally, don't toggle the row

    var row = e.target.closest(".dep-row");
    if(row){
      var rowTripId = row.getAttribute("data-trip-id");
      state.expandedTripId = (state.expandedTripId === rowTripId) ? null : rowTripId;
      render();
    }
  });

  populateSelects();
  render();
  setInterval(render, 15000);

})();
</script>
</body>
</html>
